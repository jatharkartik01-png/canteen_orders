<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#F6A820">
<link rel="apple-touch-icon" href="/static/images/new-logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skip_theQueue - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .app-screen {
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            max-height: 880px;
            background-color: #000000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            border-radius: 40px;
        }

        @media (max-width: 480px), (max-height: 800px) {
            body {
                background-color: #000000;
            }
            .app-screen {
                max-width: 100%;
                height: 100dvh;
                max-height: none;
                border-radius: 0;
                box-shadow: none;
                border: none;
            }
        }

        .app-header {
            text-align: center;
            padding: 30px 20px 10px;
            flex-shrink: 0;
        }

        .brand-tag {
            font-size: 11px;
            color: #F6A820;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .brand-title {
            font-family: 'roboto', serif;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .hero-dish-container {
            position: relative;
            display: flex;
            justify-content: center;
            padding: 12px 0;
            flex-shrink: 0;
        }

        .hero-dish-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dish-glow {
            position: absolute;
            width: 90px;
            height: 90px;
            background: #F6A820;
            filter: blur(50px);
            opacity: 0.15;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .form-section {
            padding: 5px 28px 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .field-label {
            font-size: 12px;
            color: #A0A0A0;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 18px;
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        input:focus {
            border-color: #F6A820;
            background: #181818;
            box-shadow: 0 0 12px rgba(246, 168, 32, 0.12);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #FFFFFF;
            -webkit-box-shadow: 0 0 0px 1000px #121212 inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-amber-pill {
            margin-top: 6px;
            width: 100%;
            height: 52px;
            background-color: #F6A820;
            color: #000000;
            border: none;
            border-radius: 28px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 8px 20px rgba(246, 168, 32, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-amber-pill:active {
            transform: scale(0.98);
        }

        .footer-links {
            text-align: center;
            padding-top: 12px;
            font-size: 13px;
            color: #888888;
            flex-shrink: 0;
        }

        .footer-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            margin-left: 6px;
            border-bottom: 1px solid #F6A820;
            padding-bottom: 2px;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #F6A820;
        }
    </style>
</head>
<body>
    <div class="app-screen">
        <header class="app-header">
            <div class="brand-tag">WESCAFE • CANTEEN</div>
            <h1 class="brand-title">Create Account</h1>
        </header>
        <div class="hero-dish-container">
            <div class="dish-glow"></div>
            <img src="{{ url_for('static', path='images/new-logo.webp') }}" alt="Wescafe Logo" class="hero-dish-img">
        </div>
        <main class="form-section">
            <form action="/register" method="POST" class="login-form">
                <div class="input-field">
                    <span class="field-label">Full Name</span>
                    <input type="text" name="username" placeholder="eg..Ravi" required autocomplete="name">
                </div>
                <div class="input-field">
                    <span class="field-label">Mobile Number</span>
                    <input type="tel" name="mobile" placeholder="9876543210" pattern="[0-9]{10}" required autocomplete="tel">
                </div>
                <div class="input-field">
                    <span class="field-label">Email Address</span>
                    <input type="email" name="email" placeholder="RollNumber@wccbm.ac.in" required autocomplete="email">
                </div>
                <div class="input-field">
                    <span class="field-label">Password</span>
                    <input type="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-amber-pill">CREATE ACCOUNT</button>
            </form>
            <div class="footer-links">
                <p>Already have an account? <a href="/">Sign In</a></p>
            </div>
        </main>
    </div>
    <script>
    // Register the Service Worker to enable the "Install App" prompt
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/static/sw.js')
                .then(registration => {
                    console.log('ServiceWorker registration successful');
                })
                .catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
        });
    }
</script>
</body>
</html>
